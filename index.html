<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barra de Abogados del Valle de Tizayuca, Estado de Hidalgo, A.C.</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ================= VARIABLES ================= */

:root{
    --azul:#0B1F3A;
    --dorado:#C9A227;
    --gris:#f5f5f5;
    --blanco:#ffffff;
}

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--gris);
    color:#333;
    line-height:1.7;
    overflow-x:hidden;
}

/* ================= LOADER ================= */

#loader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:var(--azul);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
    color:white;
    transition:opacity 1s ease;
}

.loader-logo{
    width:180px;
    height:180px;
    object-fit:contain;
    animation:logoAnim 1.5s infinite;
}

@keyframes logoAnim{
    0%{transform:scale(.8);opacity:.5;}
    50%{transform:scale(1.05);opacity:1;}
    100%{transform:scale(1);opacity:.8;}
}

body.loaded #loader{
    opacity:0;
    pointer-events:none;
}

#loader h2{
    margin-top:20px;
    color:var(--dorado);
    text-align:center;
    font-size:1.2rem;
    padding:0 20px;
}

/* ================= HEADER ================= */

header{
    background:rgba(11,31,58,.95);
    position:sticky;
    top:0;
    z-index:999;
    border-bottom:3px solid var(--dorado);
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

nav{
    display:flex;
    justify-content:center;
    gap:25px;
    padding:15px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:var(--dorado);
}

/* ================= HERO ================= */

.hero{
    background:
    linear-gradient(rgba(11,31,58,.82),rgba(11,31,58,.82)),
    url("themis.jpg");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:120px 20px;
}

.logo{
    width:280px;
    height:280px;
    object-fit:contain;
    margin-bottom:25px;
    filter:drop-shadow(0 10px 25px rgba(0,0,0,.45));
}

.hero h1{
    font-size:2.5rem;
    color:var(--dorado);
    max-width:1100px;
}

.hero p{
    margin-top:20px;
    max-width:900px;
    font-size:1.1rem;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 30px;
    background:linear-gradient(135deg,#C9A227,#e5c65a);
    color:#111;
    font-weight:bold;
    text-decoration:none;
    border-radius:8px;
    transition:.3s;
    border:1px solid #b08a18;
}

.btn:hover{
    background:var(--azul);
    color:white;
}

/* ================= GENERAL ================= */

section{
    padding:100px 10%;
}

h2{
    text-align:center;
    color:var(--azul);
    font-size:2rem;
    margin-bottom:60px;
    position:relative;
}

h2::after{
    content:"";
    width:80px;
    height:3px;
    background:var(--dorado);
    position:absolute;
    bottom:-15px;
    left:50%;
    transform:translateX(-50%);
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* ================= TIMELINE PRO ================= */

.timeline{
    position:relative;
    max-width:1100px;
    margin:auto;
}

/* línea central */
.timeline::before{
    content:"";
    position:absolute;
    width:4px;
    background:var(--dorado);
    top:0;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    border-radius:10px;
}

/* item */
.timeline-item{
    position:relative;
    width:50%;
    padding:20px 40px;
    opacity:0;
    transform:translateY(40px);
    transition:all .6s ease;
}

.timeline-item.show{
    opacity:1;
    transform:translateY(0);
}

/* izquierda */
.timeline-item.left{
    left:0;
    text-align:right;
}

/* derecha */
.timeline-item.right{
    left:50%;
    text-align:left;
}

/* punto SCJN */
.timeline-item::before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    background:var(--dorado);
    border:4px solid var(--azul);
    top:25px;
    border-radius:50%;
}

.timeline-item.left::before{
    right:-10px;
}

.timeline-item.right::before{
    left:-10px;
}

/* contenido */
.timeline-item .content{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.timeline-item h3{
    color:var(--azul);
    margin-bottom:10px;
}

.timeline-item img{
    width:100%;
    max-height:420px;
    object-fit:contain;
    margin-top:10px;
    border-radius:12px;
    background:#f5f5f5;
}

/* ================= CONTACTO ================= */

#contacto .card{
    max-width:700px;
    margin:auto;
    text-align:center;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

form input,
form textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}

form input:focus,
form textarea:focus{
    border-color:var(--dorado);
    outline:none;
}

/* ================= FOOTER ================= */

footer{
    background:var(--azul);
    color:white;
    padding:30px 20px;
    margin-top:60px;
}

/* ================= RELOJ ================= */

#reloj{
    text-align:center;
    margin-top:20px;
}

/* ================= RESPONSIVE ================= */

@media (max-width:768px){

    .hero h1{
        font-size:1.8rem;
    }

    .logo{
        width:200px;
        height:200px;
    }

    section{
        padding:70px 5%;
    }

    nav{
        gap:15px;
    }

    .timeline::before{
        left:10px;
    }

    .timeline-item{
        width:100%;
        padding-left:40px;
        padding-right:10px;
        text-align:left !important;
    }

    .timeline-item.left,
    .timeline-item.right{
        left:0;
    }

    .timeline-item::before{
        left:0;
    }
}

/* ================= GLOBAL ================= */

img{
    max-width:100%;
}

body, html{
    overflow-x:hidden;
}

</style>
</head>

<body>

<style>

:root{
--azul:#0B1F3A;
--dorado:#C9A227;
--gris:#f5f5f5;
--blanco:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#f5f5f5;
color:#333;
line-height:1.7;
overflow-x:hidden;
}

/* ================= LOADER ================= */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:var(--azul);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
color:white;
transition:opacity 1s ease;
}

.loader-logo{
width:180px;
height:180px;
object-fit:contain;
animation:logoAnim 1.5s infinite;
}

@keyframes logoAnim{
0%{
transform:scale(.8);
opacity:.5;
}
50%{
transform:scale(1.05);
opacity:1;
}
100%{
transform:scale(1);
opacity:.8;
}
}

body.loaded #loader{
opacity:0;
pointer-events:none;
}

#loader h2{
margin-top:20px;
color:var(--dorado);
text-align:center;
font-size:1.2rem;
padding:0 20px;
}

/* ================= HEADER ================= */

header{
background:rgba(11,31,58,.95);
position:sticky;
top:0;
z-index:999;
border-bottom:3px solid var(--dorado);
box-shadow:0 5px 20px rgba(0,0,0,.25);
}

nav{
display:flex;
justify-content:center;
gap:25px;
padding:15px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

nav a:hover{
color:var(--dorado);
}

/* ================= HERO ================= */

.hero{
background:
linear-gradient(rgba(11,31,58,.82),rgba(11,31,58,.82)),
url("themis.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:120px 20px;
}

.logo{
width:280px;
height:280px;
object-fit:contain;
margin-bottom:25px;
filter:drop-shadow(0 10px 25px rgba(0,0,0,.45));
}

.hero h1{
font-size:2.5rem;
color:var(--dorado);
max-width:1100px;
}

.hero p{
margin-top:20px;
max-width:900px;
font-size:1.1rem;
}

.btn{
display:inline-block;
margin-top:30px;
padding:14px 30px;
background:linear-gradient(135deg,#C9A227,#e5c65a);
color:#111;
font-weight:bold;
text-decoration:none;
border-radius:8px;
transition:.3s;
border:1px solid #b08a18;
}

.btn:hover{
background:var(--azul);
color:white;
}

/* ================= GENERAL ================= */

section{
padding:100px 10%;
}

h2{
text-align:center;
color:var(--azul);
font-size:2rem;
margin-bottom:60px;
position:relative;
}

h2::after{
content:"";
width:80px;
height:3px;
background:var(--dorado);
position:absolute;
bottom:-15px;
left:50%;
transform:translateX(-50%);
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

/* ================= TIMELINE ================= */

/* ================= TIMELINE PREMIUM ================= */

.timeline{
max-width:1200px;
margin:auto;
display:flex;
flex-direction:column;
gap:45px;
}

.timeline-item{

background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.10);
transition:.35s;
border-left:6px solid var(--dorado);

opacity:0;
transform:translateY(40px);

}

.timeline-item.visible{

opacity:1;
transform:translateY(0);

}

.timeline-item:hover{

transform:translateY(-8px);
box-shadow:0 18px 40px rgba(0,0,0,.18);

}

.timeline-header{

padding:25px;

background:linear-gradient(135deg,var(--azul),#183b6b);

color:white;

}

.timeline-header h3{

margin-bottom:12px;
font-size:1.35rem;
color:var(--dorado);

}

.timeline-header p{

margin:6px 0;
font-size:1rem;
line-height:1.6;

}

/*================ GALERIA =================*/

.gallery-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:15px;

padding:20px;

}

.gallery-grid img{

width:100%;
height:230px;
object-fit:cover;

border-radius:12px;

cursor:pointer;

transition:.35s;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.gallery-grid img:hover{

transform:scale(1.05);

box-shadow:0 15px 25px rgba(0,0,0,.30);

}

/*================ MODAL =================*/

.modal{

display:none;

position:fixed;

z-index:999999;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.92);

justify-content:center;
align-items:center;
flex-direction:column;

padding:30px;

}

.modal.active{

display:flex;

animation:fade .4s;

}

.modal img{

max-width:92%;
max-height:80vh;

border-radius:15px;

box-shadow:0 20px 45px rgba(0,0,0,.45);

}

.modal span{

position:absolute;

top:25px;
right:35px;

font-size:45px;

color:white;

cursor:pointer;

transition:.3s;

}

.modal span:hover{

color:var(--dorado);

}

.modal h3{

color:white;

margin-top:20px;

font-size:1.2rem;

text-align:center;

max-width:900px;

}

.modal .prev,
.modal .next{

position:absolute;

top:50%;

transform:translateY(-50%);

font-size:55px;

color:white;

cursor:pointer;

padding:18px;

user-select:none;

transition:.3s;

}

.modal .prev:hover,
.modal .next:hover{

color:var(--dorado);

}

.modal .prev{

left:25px;

}

.modal .next{

right:25px;

}

@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}

/*================ RESPONSIVE =================*/

@media(max-width:768px){

.timeline-header{

padding:18px;

}

.gallery-grid{

grid-template-columns:repeat(auto-fit,minmax(150px,1fr));

}

.gallery-grid img{

height:170px;

}

.modal img{

max-width:98%;

}

.modal .prev,
.modal .next{

font-size:40px;

}

}

<!-- ================= NOSOTROS ================= -->

<section id="nosotros">

<h2>
<i class="fas fa-scale-balanced"></i>
¿Quiénes Somos?
</h2>

<div class="card">

<p>
La Barra de Abogados del Valle de Tizayuca, Estado de Hidalgo, A.C., es una asociación civil integrada por profesionales del Derecho comprometidos con el fortalecimiento de la cultura jurídica, la promoción de la legalidad, la difusión del conocimiento jurídico y la defensa del Estado de Derecho.
</p>

<br>

<p>
Nuestra organización reúne abogados, juristas y especialistas de diversas ramas del Derecho, generando espacios de análisis, colaboración e intercambio de conocimientos para contribuir al perfeccionamiento de la práctica jurídica y al fortalecimiento de las instituciones.
</p>

<br>

<p>
Asimismo, buscamos acercar la justicia y el conocimiento jurídico al público en general, promoviendo una cultura de legalidad que permita que el Derecho y la justicia lleguen a todas las personas.
</p>

</div>

<div class="cards">

<div class="card">

<h3>
<i class="fas fa-bullseye"></i>
Misión
</h3>

<p>
Promover la excelencia profesional, la actualización permanente, la ética jurídica y la participación activa de los profesionales del Derecho.
</p>

</div>

<div class="card">

<h3>
<i class="fas fa-landmark"></i>
Visión
</h3>

<p>
Ser una organización jurídica reconocida por su liderazgo, compromiso social y aportación al fortalecimiento del Estado de Derecho.
</p>

</div>

<div class="card">

<h3>
<i class="fas fa-handshake"></i>
Compromiso
</h3>

<p>
Trabajar para fortalecer la cultura jurídica y acercar el conocimiento del Derecho a la sociedad.
</p>

</div>

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barra de Abogados del Valle de Tizayuca, Estado de Hidalgo, A.C.</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
--azul:#0B1F3A;
--dorado:#C9A227;
--gris:#f5f5f5;
--blanco:#ffffff;
}

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#f5f5f5;
color:#333;
line-height:1.7;
overflow-x:hidden;
}

/* LOADER */
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:var(--azul);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
color:white;
transition:opacity 1s ease;
}

.loader-logo{
width:180px;
height:180px;
object-fit:contain;
animation:logoAnim 1.5s infinite;
}

@keyframes logoAnim{
0%{transform:scale(.8);opacity:.5;}
50%{transform:scale(1.05);opacity:1;}
100%{transform:scale(1);opacity:.8;}
}

body.loaded #loader{
opacity:0;
pointer-events:none;
}

#loader h2{
margin-top:20px;
color:var(--dorado);
text-align:center;
font-size:1.2rem;
padding:0 20px;
}

/* HEADER */
header{
background:rgba(11,31,58,.95);
position:sticky;
top:0;
z-index:999;
border-bottom:3px solid var(--dorado);
box-shadow:0 5px 20px rgba(0,0,0,.25);
}

nav{
display:flex;
justify-content:center;
gap:25px;
padding:15px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

nav a:hover{
color:var(--dorado);
}

/* HERO */
.hero{
background:
linear-gradient(rgba(11,31,58,.82),rgba(11,31,58,.82)),
url("themis.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:120px 20px;
}

.logo{
width:280px;
height:280px;
object-fit:contain;
margin-bottom:25px;
filter:drop-shadow(0 10px 25px rgba(0,0,0,.45));
}

/* BOTÓN */
.btn{
display:inline-block;
margin-top:30px;
padding:14px 30px;
background:linear-gradient(135deg,#C9A227,#e5c65a);
color:#111;
font-weight:bold;
text-decoration:none;
border-radius:8px;
transition:.3s;
border:1px solid #b08a18;
}

.btn:hover{
background:var(--azul);
color:white;
}

/* GENERAL */
section{
padding:100px 10%;
}

h2{
text-align:center;
color:var(--azul);
font-size:2rem;
margin-bottom:60px;
position:relative;
}

h2::after{
content:"";
width:80px;
height:3px;
background:var(--dorado);
position:absolute;
bottom:-15px;
left:50%;
transform:translateX(-50%);
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

/* ================= IMÁGENES PERFECTAS ================= */

img{
max-width:100%;
height:auto;
display:block;
}

.card img,
.timeline-item img{
width:100%;
aspect-ratio:16/9;
object-fit:contain;   /* NO recorta */
background:#f5f5f5;
border-radius:12px;
padding:10px;
transition:transform .5s ease, box-shadow .5s ease;
}

.card img:hover,
.timeline-item img:hover{
transform:scale(1.03);
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* ================= TIMELINE ================= */

.timeline{
display:flex;
flex-direction:column;
gap:30px;
position:relative;
}

.timeline::before{
content:"";
position:absolute;
left:20px;
top:0;
bottom:0;
width:3px;
background:var(--dorado);
}

.timeline-item{
position:relative;
background:white;
padding:20px 20px 20px 55px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

opacity:0;
transform:translateY(40px);
transition:all .8s ease;
}

.timeline-item.show{
opacity:1;
transform:translateY(0);
}

.timeline-item::before{
content:"";
position:absolute;
left:12px;
top:25px;
width:16px;
height:16px;
background:var(--azul);
border:3px solid var(--dorado);
border-radius:50%;
}

.timeline-item h3{
color:var(--azul);
margin-bottom:10px;
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<img src="LOGO_BARRA-removebg-preview.png" class="loader-logo">
<h2>Barra de Abogados del Valle de Tizayuca</h2>
</div>

<!-- HEADER -->
<header>
<nav>
<a href="#inicio">Inicio</a>
<a href="#nosotros">Nosotros</a>
<a href="#circulares">Circulares</a>
<a href="#calendario">Calendario</a>
<a href="#tribunales">Tribunales</a>
<a href="#galeria">Actividades</a>
<a href="#contacto">Contacto</a>
</nav>
</header>

<!-- HERO -->
<section id="inicio" class="hero">
<img src="LOGO_BARRA-removebg-preview.png" class="logo">

<h1>Barra de Abogados del Valle de Tizayuca</h1>
<p>Comprometidos con la formación jurídica y el Estado de Derecho.</p>

<a href="#nosotros" class="btn">Conócenos</a>
</section>

<!-- ===================== TODO TU CONTENIDO SE QUEDA IGUAL ===================== -->
<!-- NO TE ELIMINO IMÁGENES NI SECCIONES -->
<!-- SOLO ESTÁS MEJORANDO ESTILO -->

<!-- TIMELINE (ejemplo ya tuyo sigue igual) -->
<section id="galeria">
<h2>Historial de Actividades</h2>

<div class="timeline">

<div class="timeline-item">
<h3>21/03/2025</h3>
<img src="WhatsApp Image 2026-06-22 at 3.16.52 PM.jpeg">
</div>

<div class="timeline-item">
<h3>05/04/2025</h3>
<img src="WhatsApp Image 2026-06-23 at 11.07.13 AM.jpeg">
</div>

</div>
</section>

<script>

window.addEventListener("load",()=>{
document.body.classList.add("loaded");
});

setTimeout(()=>document.body.classList.add("loaded"),4000);

const items=document.querySelectorAll(".timeline-item");

function show(){
const trigger=window.innerHeight*0.85;

items.forEach(i=>{
if(i.getBoundingClientRect().top<trigger){
i.classList.add("show");
}
});
}

window.addEventListener("scroll",show);
window.addEventListener("load",show);

</script>

</body>
</html>
